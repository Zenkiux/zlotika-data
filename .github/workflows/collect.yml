# Runs the collector once a day and publishes out/ (deals, leaflets, fuel, stores + config.json)
# to GitHub Pages, where the app reads it. Free on GitHub; the only (optional) secret is GEMINI_API_KEY.
name: collect
on:
  schedule:
    - cron: '17 4 * * *'   # 04:17 UTC daily (06:17 in Lithuania)
  workflow_dispatch: {}
permissions:
  contents: write   # only for the keep-alive commit below
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      # Tesseract language data, cached between runs.
      - uses: actions/cache@v4
        with: { path: .tessdata, key: tessdata-pol-v1 }
      # PaddleOCR: open-source fallback reader for leaflet pages the vision model doesn't cover.
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: tools/requirements.txt }
      - run: pip install -r tools/requirements.txt
      - uses: actions/cache@v4
        with: { path: ~/.paddlex, key: paddlex-models-v1 }
      # Start from yesterday's published feed so a failing source keeps its last data.
      - name: Fetch previous feed
        run: |
          mkdir -p out
          curl -sf "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/deals.json" -o out/deals.json || true
          curl -sf "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/leaflets.json" -o out/leaflets.json || true
          curl -sf "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/fuel.json" -o out/fuel.json || true
          curl -sf "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/stores.json" -o out/stores.json || true
          curl -sf "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/prices.json" -o out/prices.json || true
          curl -sf "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/vision-cache.json" -o out/vision-cache.json || true
          cp config.json out/config.json   # the off switch: edit config.json in the repo
      - run: node --max-http-header-size=131072 src/run.ts
        env:
          # Optional free Google AI Studio key: reads leaflet pages far better than OCR.
          # Without it the collector uses OCR only.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PADDLE_PYTHON: python
      # GitHub pauses scheduled workflows in public repos after 60 days without activity.
      # If the repo has been quiet for 50 days, record the run date so updates never stop.
      - name: Keep the nightly schedule alive
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 50 * 86400 )) ]; then
            date -u +%F > last-run.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add last-run.txt && git commit -m "Keep nightly schedule alive ($(date -u +%F))" && git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }
      - id: deploy
        uses: actions/deploy-pages@v4
